services:
  ambient-radio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: retro-ambient-radio
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/app/data
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=ambient-radio-admin
    volumes:
      # Persistent local music directory
      - radio-music:/app/data/music
      # Persistent artwork directory
      - radio-artwork:/app/data/artwork
      # Database and application settings
      - radio-data:/app/data
      # Temporary download directory for active yt-dlp jobs
      - radio-temp:/app/data/temp
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/stations"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  radio-music:
    driver: local
  radio-artwork:
    driver: local
  radio-data:
    driver: local
  radio-temp:
    driver: local
