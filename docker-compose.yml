services:
  kaminari-radio:
    build:
      context: .
      dockerfile: Dockerfile
    image: kaminari-radio:latest
    container_name: kaminari-radio
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/app/data
      - APP_URL=${APP_URL:-http://localhost:3000}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
    volumes:
      # Music library: bind to a host directory (MUSIC_HOST_DIR) or a named volume by default
      - ${MUSIC_HOST_DIR:-kaminari-music}:/app/data/music
      # Persistent artwork directory
      - kaminari-artwork:/app/data/artwork
      # Database and application settings
      - kaminari-data:/app/data
      # Temporary download directory for active yt-dlp jobs
      - kaminari-temp:/app/data/temp
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/stations"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  kaminari-music:
    driver: local
  kaminari-artwork:
    driver: local
  kaminari-data:
    driver: local
  kaminari-temp:
    driver: local